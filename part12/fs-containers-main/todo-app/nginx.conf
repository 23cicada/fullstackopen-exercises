# events is required, but defaults are ok
events { }

# A http server, listening at port 80
http {
  # Needed so that .js/.css are served with correct Content-Type
  include /etc/nginx/mime.types;

  server {
    listen 80;

    # Serve the static frontend; fall back to index.html for SPA routes
    location / {
      # The frontend build is copied here in the frontend Dockerfile
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    location /api/ {
      proxy_pass http://server:3000/;
    }
  }
}
